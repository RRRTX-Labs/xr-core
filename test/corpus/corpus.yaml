# Compat corpus (P9-T4) — data, not code. §11.12.
#
# Entries carry a URL *class* (never a live URL): no scraping and no live-site
# dependency in this phase. Each entry = {url class, flow steps as data,
# expectations, owner, provenance}. `mode: expectations-only` is what runs
# here; `mode: live` needs XR_LIVE_NET=1 AND a host on the fetch.py allowlist
# (none is, for web hosts) — see tools/compat.py for the refusal law.
#
# Corpus size honesty (DoD 6): the plan's full 500+200+50 set is authored
# progressively — P36 (hard-app scripts) and P38 (corpus freshness) own the
# remaining entries; padding entries that test nothing are worse than a
# missing one, so this phase ships the representative set below and names
# the owning phase per entry. Every entry here is real: its flow class has an
# offline replay fixture that exercises the same class.
schema_version: 1

entries:
  # ---- top-500 global representatives (class-level) ----
