# patches/manifest.yaml — patch-manifest format v1 (P2-T3).
#
# The budget ledger for XR's upstream modifications (Plan §1.2). The applicator
# (xr-browser/build/patching/apply.py) reads this from src/xr/patches/.
# Contract: xr-browser/docs/contracts/patch-manifest-v1.md.
# Caps are plan law (also encoded in build/patching/categories.py); they are
# repeated here for self-description and cross-checked by `xr-patch lint`.

schema_version: 1
total_cap: 150
categories:
  branding: { cap: null }       # "unlimited-ish (cheap)" — still counted in total
  hook_points: { cap: 45 }
  blink_seams: { cap: 25 }
  content_seams: { cap: 30 }
  network_seams: { cap: 20 }
  ui: { cap: 35 }
  extension_chokepoint: { cap: 2 }
allowed_roots:
  - "chrome/app/"
  # P7 (Stage 1): the chrome/browser/ui command seam is the plan's first real
  # UI-hook consumer ("chrome/browser/ui/**: toolbar view, app-menu model
  # builder, tabstrip color path"). The §12.7 never-list (content/**, blink/**)
  # is enforced independently by build/webui/patch_roundtrip.py's never-list
  # check, not by relaxing it here.
  - "chrome/browser/ui/"
  # P11 (DoD-10): the network-service seam root — XR Shield's pre-first-packet
  # consult lives in services/network (patch 0200). The §12.7 never-list
  # (content/**, blink/**, third_party/**, v8/**) is enforced independently by
  # build/webui/shield_seam_roundtrip.py's never-list check; adding this root
  # does not relax it.
  - "services/network/"
patches:
  - id: "0001-brand-ui"
    owner: "@xr/platform"
    category: branding
    files:
      - chrome/app/theme/chromium/BRANDING
      - chrome/app/chromium_strings.grd
    dir: branding/0001-brand-ui   # relative to this manifest's directory (patches/)
  # P7 (Stage 1): the chrome/browser/ui command seam (first real UI-hook
  # consumer). category ui (cap 35). 9 files (4 upstream + 5 XR-owned payload),
  # within the plan's <=12-file budget. Round-trip-proven at the pin by
  # xr-browser build/webui/patch_roundtrip.py.
  - id: "0100-ui-skeleton"
    owner: "@xr/platform"
    category: ui
    files:
      - chrome/browser/ui/views/BUILD.gn
      - chrome/browser/ui/views/toolbar/app_menu.cc
      - chrome/browser/ui/views/toolbar/toolbar_view.cc
      - chrome/browser/ui/views/frame/browser_frame_view.cc
      - chrome/browser/ui/xr/BUILD.gn
      - chrome/browser/ui/xr/xr_command_bridge.h
      - chrome/browser/ui/xr/xr_command_bridge.cc
      - chrome/browser/ui/xr/xr_identity_color_bar.h
      - chrome/browser/ui/xr/xr_identity_color_bar.cc
    dir: ui-skeleton/0100-ui-skeleton
  # P11 (DoD-10): the XR Shield network seam — the pre-first-packet consult in
  # URLLoader::ScheduleStart, engine injected by //xr glue (xr-core
  # shield/core/engine.h contract; vendored adblock-rust behind the
  # xr_shield_engine C ABI). category network_seams (cap 20). 5 files
  # (3 upstream hooks + 2 XR-owned payload), within DoD-10's <=8-file budget.
  # Round-trip-proven at the pin by xr-browser
  # build/webui/shield_seam_roundtrip.py (real fetch, byte-exact revert,
  # anchor-perturbation negative — every run_checks + governance run).
  - id: "0200-shield-network-seam"
    owner: "@xr/platform"
    category: network_seams
    files:
      - services/network/BUILD.gn
      - services/network/url_loader.cc
      - services/network/network_context.cc
      - services/network/xr/xr_shield_gate.h
      - services/network/xr/xr_shield_gate.cc
    dir: network-seams/0200-shield-network-seam
