# mode_lint.cfg — exemption baseline for tools/mode_lint.py (xr-browser).
#
# L3 law: "one policy resolver; unknown/absent policy => deny, never guess."
# The lint bans subsystem-private mode/trust logic OUTSIDE the resolver: any
# code reading TrustContext / dial positions / trust tiers to make its own
# decisions is a second brain and fails the build (enforcement bites from
# P7 adoption per the plan; this baseline is green at P6 and CI-wired).
#
# Format: one path prefix per 'exempt:' line, with a rationale on the
# following 'because:' line. Reviewers: exemptions are S0 review surface.

schema_version: 1

exempt: /policy/
because: THE resolver — trust-tier logic is its job (L3 owner).

exempt: /fakes/
because: frozen P5 behavioral fakes; they *simulate* the contracts
  (policy_resolver.py is the parity reference; do not modify to dodge
  the lint — that is a frozen-contract amendment).

exempt: /mojom/
because: frozen contract surface; enum names (TrustContext values) are
  declarations, not decision logic.

exempt: /policy/tests/
because: resolver tests must reference tier names to prove the truth
  table (covered transitively by /policy/; listed for explicitness).

exempt: /spike/
because: P4 identity-seam spike kit — farm-branch-only probes, never in
  product builds; contains no trust-tier reads today (verified at P6
  baseline; if that changes, the spike re-scopes or the exemption is
  argued anew in review).

# --- P7 (Stage 1) exemptions: the one-brain's AUTHORIZED consumers, not
# second brains. The L3 ban is on making one's OWN mode/trust DECISIONS from
# tier tokens. These paths either read the resolver's OUTPUT (a pinned
# snapshot) by the P7 availability-predicate contract, or write/read the P6
# state doc that policy_core itself validates. Neither resolves policy.

exempt: /commands/core/availability.h
exempt: /commands/core/availability.cc
because: THE availability-predicate contract (P7 "Contracts out"): predicates
  are pure reads of the PINNED P6 snapshot (data in, verdict out). They consume
  the resolver's OUTPUT, never its input decision logic, and never call
  Resolve() live (TOCTOU rule inherited; test_availability.cc proves the
  pinned-snapshot semantics).

exempt: /commands/core/policy_state.h
exempt: /commands/core/policy_state.cc
because: the P6 policy-STATE bridge — writes/reads the trust-bindings-v1 doc.
  It does NOT decide a tier; it persists the caller's explicit Set/Remove and
  the dial test loads the output back through policy_core (PolicyStore) to
  prove it is valid P6 state, not a second resolver.

exempt: /commands/host/
because: the stdio façade forwards to the core (dispatch/availability/
  policy_state above); the host carries no mode logic of its own (it is the
  byte-parity reference surface for fakes/commands.py).

exempt: /patches/
because: upstream patch PAYLOADS (e.g. the P7 ui-skeleton color-bar data path)
  are Chromium source artifacts in the overlay repo, not product decision
  logic. The color bar maps a PINNED tier to a color (data-only, layout-
  agnostic); it is reviewed in the patch budget, not the one-brain lint.

exempt: /commands/tests/
because: command tests must reference tier names, predicate ids and TrustTierIndex
  to prove the contract truth table (pinned-snapshot semantics, dial toggle,
  dial-end-to-end). Same rationale as /policy/tests/ (P6 precedent).

exempt: /shield/tests/
because: shield context/parse tests must spell resolver tier tokens
  (kStandard) inside REFUSED request frames to prove the identity
  grammar is a closed key set that never consumes grade/tier — same
  rationale as /policy/tests/ and /commands/tests/ (P6/P7 precedent).
  The shield implementation is NOT exempt: /shield/core/, /shield/host/
  and /shield/engine/ stay fully scanned.
